name: Build Native Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle wrapper
        run: |
          # Create gradle wrapper directory
          mkdir -p gradle/wrapper
          # Download a recent gradle-wrapper.jar
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          # Create gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          # Create gradlew script (for Linux/macOS)
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
          # Create gradlew.bat (for Windows, optional)
          cat > gradlew.bat << 'EOF'
          @if "%DEBUG%" == "" @echo off
          @rem ##########################################################################
          @rem  Gradle startup script for Windows
          @rem ##########################################################################
          set DIRNAME=%~dp0
          set APP_BASE_NAME=%~n0
          set CP="%DIRNAME%gradle\wrapper\gradle-wrapper.jar"
          java -cp %CP% org.gradle.wrapper.GradleWrapperMain %*
          EOF

      - name: Build APK (debug)
        run: ./gradlew assembleDebug

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HailOfBlades-Native-APK
          path: app/build/outputs/apk/debug/*.apk
