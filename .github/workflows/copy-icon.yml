name: Copy Icon to Mipmap Folders

on:
  workflow_dispatch:   # Manual trigger only

jobs:
  copy-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit the copied icons
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy icon.png to all mipmap folders
        run: |
          # Check if icon.png exists in the root
          if [ ! -f "icon.png" ]; then
            echo "❌ icon.png not found in repository root!"
            exit 1
          fi

          # Find all mipmap directories
          MIPMAP_DIRS=$(find app/src/main/res -type d -name "mipmap-*" 2>/dev/null || true)

          if [ -z "$MIPMAP_DIRS" ]; then
            echo "❌ No mipmap directories found. Run the project structure workflow first."
            exit 1
          fi

          # Copy the icon to each mipmap folder
          for dir in $MIPMAP_DIRS; do
            cp icon.png "$dir/ic_launcher.png"
            echo "✅ Copied to $dir/ic_launcher.png"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/mipmap-*/ic_launcher.png
          if git diff --cached --quiet; then
            echo "No changes to commit (icon already in place)."
          else
            git commit -m "Update app icon from root icon.png"
            git push origin HEAD:${{ github.ref_name }}
          fi
